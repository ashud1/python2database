{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Django Level Two</title>
  <link rel="stylesheet" href="{% static "css/mystyle.css" %}"/>
</head>
<body>
  <h1> Hi welcome to Djano level two</h1>
  <h2>here are the your access records:</h2>
  <div class="djangtwo">
     {% if access_records %}
        <table>
          <thead>
            <th>
              site name
            </th>
            <th>
              date Accessed
            </th>
          </thead>
        {% for acc in access_records %}
        <tr>
          <td>{{ acc.name }}</td>
          <td>{{ acc.date }}</td>
        </tr>
        {% endfor %}
        </table>
        {% else %}
        <p> No access records found !</p>
        {% endif %}
  </div>
  
</body>
</html>
